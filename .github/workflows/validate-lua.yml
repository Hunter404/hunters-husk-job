name: Validate Lua Scripts

on:
  pull_request:
    paths:
      - '**/*.lua'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Luacheck linter
        uses: lunarmodules/luacheck@v1
        with:
          args: . --config .luacheckrc